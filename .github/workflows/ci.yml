name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Java 21 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Derle, test et ve coverage kontrolü yap
        run: ./mvnw -B verify

      - name: Coverage raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Node.js 22 kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Derle (tip kontrolü dahil)
        run: npm run build

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [ build-and-test, frontend ]

    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Backend image oluştur
        run: docker build -t taskmanager-backend:ci ./backend

      - name: Frontend image oluştur
        run: docker build -t taskmanager-frontend:ci ./frontend